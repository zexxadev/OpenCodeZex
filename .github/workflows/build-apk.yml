name: Build OpenCodeZex APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests & Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK to OpenCodeZex-debug.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OpenCodeZex-debug.apk

      - name: Upload OpenCodeZex APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeZex-debug-apk
          path: app/build/outputs/apk/debug/OpenCodeZex-debug.apk
